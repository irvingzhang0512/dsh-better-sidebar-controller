# dsh-better-sidebar-controller bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-better-sidebar-controller@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-better-sidebar-controller` to the
# bundle stack. The profile boot then merges THIS patch (a single `insert` of
# the plugin row) like a manual cordis.patch.yml mount line.
#
# `name` must stay the full npm package name: the client-modules registry
# resolves the browser bundle by the loader entry name, so a shortened name
# leaves the client half silently out of window.__DSH_BOOT__.
#
# The controller is a soft dependency on dsh-better-sidebar: the host half
# mounts its tools/bridge regardless, and the client half only activates once
# `ctx.betterSidebar` is provided (i.e. when better-sidebar is installed).
- insert:
    - id: dsh-better-sidebar-controller
      name: 'dsh-better-sidebar-controller'
      config: {}
